<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img" aria-labelledby="title desc">
  <title id="title">Ruichiji default R emblem</title>
  <desc id="desc">Dark-mode background with a centered stylized letter R as the emblem (no circle).</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#071018"/>
      <stop offset="1" stop-color="#05080a"/>
    </linearGradient>
    <linearGradient id="rGrad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#6ff3df"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="ds" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" rx="28" fill="url(#bgGrad)"/>
  <g transform="translate(0,0)" filter="url(#ds)">
    <text x="300" y="300" text-anchor="middle" dominant-baseline="middle"
          font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial"
          font-weight="800" font-size="360" fill="url(#rGrad)" style="letter-spacing:-14px;">
      R
    </text>
  </g>
</svg>
